<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Omoiyari — Email Confirmed</title>
<style>
  :root {
    --forest: #2B3A32;
    --ivory: #F7F4EC;
    --gold: #C9A24B;
    --text-secondary: #6B6B60;
    --border: #E2DCC9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--ivory);
    color: var(--forest);
    line-height: 1.6;
  }
  .wrap { max-width: 440px; padding: 40px 24px 64px; text-align: center; }
  .check {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: var(--forest);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .check svg { width: 30px; height: 30px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  .lede { color: var(--text-secondary); font-size: 15px; margin: 0 0 28px; }
  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
    text-align: left;
  }
  .card h2 { font-size: 15px; margin: 0 0 10px; }
  ol { margin: 0; padding-left: 20px; }
  li { font-size: 15px; margin-bottom: 8px; }
  li:last-child { margin-bottom: 0; }
  .note { font-size: 13px; color: var(--text-secondary); margin-top: 24px; }
  a { color: var(--gold); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F7F4EC" stroke-width="3"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <h1>Email confirmed</h1>
    <p class="lede">Your Omoiyari account is ready to use.</p>

    <div class="card">
      <h2>Next steps</h2>
      <ol>
        <li>Close this page and open the <strong>Omoiyari</strong> app.</li>
        <li>Sign in with the email and password you just registered.</li>
        <li>Add your pet's profile and you're set.</li>
      </ol>
    </div>

    <p class="note">
      Trouble signing in? Email us at
      <a href="mailto:support@getomoiyari.com">support@getomoiyari.com</a><br />
      <a href="./index.html">Omoiyari Support</a>
    </p>
  </div>
</body>
</html>
